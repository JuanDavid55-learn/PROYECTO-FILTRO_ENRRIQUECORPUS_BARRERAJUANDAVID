<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versión movil</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <div class="principal">
        <div class="encabezadoPerfil">
            <div class="desplegar">
                <img src="../img/configuraciones.png" alt="" class="imgconf">
            </div>
            <div class="desplegar">
                <img src="../img/notificaciones.png" alt="" class="imgnotif">
            </div>
            <div class="desplegar">
                <img src="../img/perfildepedrito.png" alt="" class="fotoPedrito">
            </div>
        </div>
        <div class="text">
            <p class="text1">Eliminar Indicador</p>
        </div>
        <div class="indicador">
            <div class="elemento" id="c1"><p id="title">Modelado 3D</p><img src="../img/pasted-image_u2net_human_seg.png" alt="" id="imgpor"></div>
        </div>
        <div class="dataEliminar">
            <div class="D-A">
                <div class="unidadData">
                    <p class="t1">Descripción</p>
                    <p class="t2">Interes por dise...</p>
                </div>
                <div class="unidadData">
                    <p class="t1">Area</p>
                    <p class="t2">Marketing</p>
                </div>
            </div>
            <div class="C-FI-FT">
                <div class="unidadData">
                    <p class="t1">Categoria</p>
                    <p class="t2">Baja</p>
                </div>
                <div class="unidadData">
                    <p class="t1">Fecha I</p>
                    <p class="t2">12/05/21</p>
                </div>
                <div class="unidadData">
                    <p class="t1">Fecha T</p>
                    <p class="t2">12/12/21</p>
                </div>
            </div>
        </div>
        <div class="textEliminar">
            <p>Si estas seguro que deseas eliminar el indicador seleccionado escribe “ELIMINAR” y presiona el boton aceptar de lo contrario presiona el boton de cancelar</p>
        </div>
        <div>
            <label for="indicador"></label>
            <input class="escribe" type="text" name="indicador" id="indicador" maxlength="10">
        </div>
        <div class="botones">
            <input type="submit" value="Aceptar" class="botonAceptar">
            <input type="submit" value="Cancelar" class="botonCan">
        </div>
        <div class="opciones">
            <div class="añadir">
                <img src="../img/añadir.png" alt="" class="imgOPC">
            </div>
            <div class="resetear">
                <img src="../img/resetear.png" alt="" class="imgOPC">
            </div>
            <div class="eliminar">
                <img src="../img/eliminar.png" alt="" class="imgOPC">
            </div>
            <div class="logoKeria">
                <img src="../img/logoproyecto.png" alt="" class="imgOPC">
            </div>
            <div class="reportar">
                <img src="../img/reportar.png" alt="" class="imgOPC">
            </div>
            <div class="ayuda">
                <img src="../img/ayuda.png" alt="" class="imgOPC">
            </div>
        </div>
    </div>
</body>
</html>
