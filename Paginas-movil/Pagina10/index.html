<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versión movil</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <div class="principal">
        <div class="encabezadoPerfil">
            <div class="desplegar">
                <img src="../img/configuraciones.png" alt="" class="imgconf">
            </div>
            <div class="desplegar">
                <img src="../img/notificaciones.png" alt="" class="imgnotif">
            </div>
            <div class="desplegar">
                <img src="../img/perfildepedrito.png" alt="" class="fotoPedrito">
            </div>
        </div>
        <div class="text">
            <p class="text1">Reportar</p>
        </div>
        <div class="hacerReporte">
            <div class="Correo">
                <p>Correo Electronico*</p>
                <label for="correo"></label>
                <input class="controles" type="text" name="correo" id="correo" maxlength="50" style="padding-left: 1vh;" placeholder="example@dominio.com">
            </div>
            <div class="OPCS">
                <p>Seleccione la opción que desea reportar*</p>
                <label for="miLista"></label>
                <select class="lista" id="miLista" name="miLista">
                    <option class="opcion1">Selecciona una opción</option>
                    <option value="opcion2">Problemas técnicos o errores</option>
                    <option value="opcion3">seguridad</option>
                    <option value="opcion3">atención al cliente</option>
                </select>
            </div>
            <div class="Descripcion">
                <p>Agrega una descripción:</p>
                <textarea class="descripcion" name="comentario" rows="4" cols="50" style="padding-left: 1vh;">

                </textarea>
            </div>
        </div>
        <div class="botones">
            <input type="submit" value="Añadir" class="botonAñadir">
            <input type="submit" value="Cancelar" class="botonCancelar">
        </div>
        <div class="opciones">
            <div class="añadir">
                <img src="../img/añadir.png" alt="" class="imgOPC">
            </div>
            <div class="resetear">
                <img src="../img/resetear.png" alt="" class="imgOPC">
            </div>
            <div class="eliminar">
                <img src="../img/eliminar.png" alt="" class="imgOPC">
            </div>
            <div class="logoKeria">
                <img src="../img/logoproyecto.png" alt="" class="imgOPC">
            </div>
            <div class="reportar">
                <img src="../img/reportar.png" alt="" class="imgOPC">
            </div>
            <div class="ayuda">
                <img src="../img/ayuda.png" alt="" class="imgOPC">
            </div>
        </div>
    </div>
</body>
</html>
