<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versión movil</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <div class="principal">
        <div class="encabezadoPerfil">
            <div class="desplegar">
                <img src="../img/configuraciones.png" alt="" class="imgconf">
            </div>
            <div class="desplegar">
                <img src="../img/notificaciones.png" alt="" class="imgnotif">
            </div>
            <div class="desplegar">
                <img src="../img/perfildepedrito.png" alt="" class="fotoPedrito">
            </div>
        </div>
        <div class="text">
            <p class="text1">Editar Indicador</p>
        </div>
        <div class="formAñadir">
            <div class="añadircontenido">
                <p>Indicador*</p>
                <label for="indicador"></label>
                <input class="controles" type="text" name="indicador" id="indicador" maxlength="50" style="padding-left: 1vh;">
            </div>
            <div class="añadircontenido">
                    <p>Descripción</p>
                    <textarea class="controlD" name="comentario" rows="4" cols="50" style="padding-left: 1vh;">

                    </textarea>
            </div>
            <div class="añadircontenido">
                <p>Categoria*</p>
                <label for="Categoria"></label>
                <input class="controles" type="text" name="Categoria" id="Categoria" maxlength="50" style="padding-left: 1vh;">
            </div>
            <div class="añadircontenido">
                <p>Fecha de inicio*</p>
                <label for="fechaInicio"></label>
                <input class="controles" type="text" name="fechaInicio" id="fechaInicio" maxlength="50" style="padding-left: 1vh;">
            </div>
            <div class="añadircontenido">
                <p>Fecha de terminación*</p>
                <label for="fechaFin"></label>
                <input class="controles" type="text" name="fechaFin" id="fechaFin" maxlength="50" style="padding-left: 1vh;">
            </div>
            <div class="añadircontenido">
                <p>Formula*</p>
                <label for="formula"></label>
                <input class="controles" type="text" name="formula" id="formula" maxlength="50" style="padding-left: 1vh;">
            </div>
            <div class="añadircontenido">
                <p>Frecuencia*</p>
                <label for="Frecuencia"></label>
                <input class="controles" type="text" name="Frecuencia" id="Frecuencia" maxlength="50" style="padding-left: 1vh;">
            </div>
            <div class="añadircontenido">
                <p>Area*</p>
                <label for="area"></label>
                <input class="controles" type="text" name="area" id="area" maxlength="50" style="padding-left: 1vh;">
            </div>
        </div>
        <div class="botones">
            <input type="submit" value="Añadir" class="botonAñadir">
            <input type="submit" value="Cancelar" class="botonCancelar">
        </div>
        <div class="opciones">
            <div class="añadir">
                <img src="../img/añadir.png" alt="" class="imgOPC">
            </div>
            <div class="resetear">
                <img src="../img/resetear.png" alt="" class="imgOPC">
            </div>
            <div class="eliminar">
                <img src="../img/eliminar.png" alt="" class="imgOPC">
            </div>
            <div class="logoKeria">
                <img src="../img/logoproyecto.png" alt="" class="imgOPC">
            </div>
            <div class="reportar">
                <img src="../img/reportar.png" alt="" class="imgOPC">
            </div>
            <div class="ayuda">
                <img src="../img/ayuda.png" alt="" class="imgOPC">
            </div>
        </div>
    </div>
</body>
</html>
