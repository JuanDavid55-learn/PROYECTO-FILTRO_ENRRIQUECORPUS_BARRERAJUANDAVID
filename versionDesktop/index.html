<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Digital Kario Media</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="contenedorDePagina">

        <img src="./img/logoKario.png" alt="" class="logoKario">

        <div class="inicioDeSesion">

            <div class="contenedorDeIS">

                <div> 
                <img src="./img/logoMediaKario.svg" alt="" class="logoMedia">
                </div>
            
                <div class="infoLogin">
                    <h2 class="titulo">Bienvenido al panel digital de <br> KARIO Media</h2>

                     <p class="parrafo1">Por favor ingresa los siguinetes datos para ingresar a la plataforma</p>
                    
                     <div class="formulario">
                        <form class="usuarioYContrasena">
                            
                            <div class="casilla">
                                <label for="usuario"><p>Usuario</p></label>
                                <input type="text" id="usuario" name="Usuario">
                            </div>
                            
                            <div class="casilla"> 
                                <label for="contrasena"><p>Contraseña</p></label>
                                <input type="password" id="contrasena" name="contrasena">
                            </div>
                            <div class="cajaBoton">
                                <button type="submit" class="boton">Ingresa al panel</button>
                            </div>
                        </form>

                    </div>
                    

                    <p class="asistenciaTecnica">Tienes problemas para ingresar? Por favor contactarse con asistencia técnica lo más pronto posible</p>

                </div>
            
                


                
            </div>

                
        </div>

    </div>
</body>
</html>
